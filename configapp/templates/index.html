<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products 3D</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <style>
        /* 3D effect container */
        .product-card {
            border-radius: 14px;
            overflow: hidden;
            transition: 0.4s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            background: #fff;
        }

        .product-card:hover {
            transform: rotateX(6deg) rotateY(6deg) scale(1.03);
            box-shadow: 0 20px 35px rgba(0,0,0,0.25);
        }

        .product-card img {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 18px;
        }

        .card-title {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container my-4">
  <h2 class="mb-4 text-center">Products</h2>

  <div class="row justify-content-end">
    <div class="col-2"><ul class="list-group list-group-light">
  <li class="list-group-item px-3 border-0 active" aria-current="true">
    Online Shop
  </li>
  <li class="list-group-item px-3 border-0"> Products</li>
  <li class="list-group-item px-3 border-0"> Suppliers</li>
  <li class="list-group-item px-3 border-0"> Categories</li>
  <li class="list-group-item px-3 border-0"> Reviews</li> </ul>
    </div>
    <!-- make 8 columns width and align right -->
    <div class="col-10">
      <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for item in product %}
        <div class="col">
          <div class="card product-card">

            <img src="{{ item.photo.url }}" class="card-img-top" alt="Product Image">


            <div class="card-body">
              <h5 class="card-title">{{ item.product_name }}</h5>

              <p class="card-text">
                {{ item.description|default:"No description available." }}
              </p>

              <p class="fw-bold text-primary">
                {{ item.unit_price }}$
              </p>
            </div>

          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>



<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>


</body>
</html>
